[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-compliance"
version = "0.2.0"
description = "Control maker agents over an A2A protocol with role authority and optional Loomground value grounding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "flxk1" }]
keywords = ["a2a", "compliance", "fleet", "orchestration", "multi-agent", "values-alignment", "human-in-the-loop"]

# The bare control path (channel, authority, envelope) has zero hard deps.
# jsonschema (schema.py) and PyYAML (governance_block.py) are imported lazily,
# function-local, and guarded: each falls back to a structural/absent-feature
# path when its package is missing, so the base install stays importable and
# functional with neither installed (SPEC invariant 1/2 concern only
# Loomground planes or a host adapter, which this repo never hard-depends on).
# a2a_compliance.wire.canonical (RFC 8785 JCS + digest) is stdlib-only and
# imported eagerly by both a2a_compliance.wire and team.py (one canonical
# action_digest implementation). a2a_compliance.wire.schema_registry/verify
# hard-import jsonschema/referencing but are loaded lazily off wire/__init__
# (PEP 562 __getattr__), so a bare install — including `import a2a_compliance`,
# which imports team.py — stays importable with neither installed; only
# touching wire.WIRE_TYPES/load_schema/validator_for/verify/NonceStore/
# InMemoryNonceStore/VerificationResult actually requires them.
dependencies = []

[project.optional-dependencies]
schema = [
    "jsonschema>=4",
    "referencing>=0.30",
]
manifest = [
    "PyYAML>=6",
]
dev = [
    "jsonschema>=4",
    "referencing>=0.30",
    "PyYAML>=6",
    "pytest>=7",
]

[tool.setuptools]
packages = ["a2a_compliance", "a2a_compliance.roles", "a2a_compliance.wire", "a2a_compliance.wire.schemas", "interfaces"]

[tool.setuptools.package-data]
a2a_compliance = ["roles/*.json", "wire/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
