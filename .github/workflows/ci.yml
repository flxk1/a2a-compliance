name: ci
on:
  push:
    branches-ignore:
      - 'release-please--**'
  pull_request:
  # Manual trigger. Also the probe for why this repository records no workflow
  # run at all: several pushes here, from more than one author, produced no
  # `github-actions` check suite on the commit -- not a failing run, no run.
  # If dispatch starts a run, the repository does receive events and the push
  # delivery is what is broken; if it does not, Actions is not active here and
  # the answer is a setting rather than a workflow.
  workflow_dispatch:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: REUSE / SPDX licensing compliance
        uses: fsfe/reuse-action@ef1dfe28dda4d13f5d580f0444eb27dda9746e9b  # v5

  tests:
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: checkout a2a-compliance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          path: a2a-compliance
      # tests/test_grounding_grounded.py real-consumes all six value planes; three of
      # them (mandate, escalation, falsifiability) are consumed straight off an on-disk
      # sibling checkout, exactly as tests/_ground_probe.py and the README document —
      # this is not packaged/pip-installed, by the plane's own on-disk-src contract.
      - name: checkout loomground-mandate (on-disk plane src)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: flxk1/loomground-mandate
          ref: 70244429255e69a18aea9a99c2bb3fb56090904f
          path: loomground-repos/loomground-mandate
      - name: checkout loomground-escalation (on-disk plane src)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: flxk1/loomground-escalation
          ref: e398bb900657ae210b35239f0235083b185279fb
          path: loomground-repos/loomground-escalation
      - name: checkout loomground-falsifiability (on-disk plane src)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: flxk1/loomground-falsifiability
          ref: e146366501bce91ec10757823dc2c9962b4d7b88
          path: loomground-repos/loomground-falsifiability
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      # The remaining planes (deontic, norm, proxy, governance, solver) are
      # pip-installed, not on PyPI, --no-deps because their own declared
      # version ranges are not resolvable from a bare install.
      - name: install a2a-compliance + the remaining value planes
        run: |
          python3 -m pip install "./a2a-compliance[dev]"
          python3 -m pip install --no-deps "git+https://github.com/flxk1/loomground-deontic.git@319e218500da42dea693830ff790343aa340bd60"
          python3 -m pip install --no-deps "git+https://github.com/flxk1/loomground-norm.git@9d5f68f140dc8a904306eb265e19ddfb4dd4562a"
          python3 -m pip install --no-deps "git+https://github.com/flxk1/loomground-proxy.git@1dddf66c3b988f51ea846dd102b9049c915362e3"
          python3 -m pip install --no-deps "git+https://github.com/flxk1/loomground-governance.git@82c7613e4a2247218a7281dd99933ed7c9e31218"
          python3 -m pip install --no-deps "git+https://github.com/flxk1/loomground-solver.git@c6f360ba6adfd81130d984b1c5818c5d551d94b8"
      # policy-compiler sibling intentionally absent — the two compile-to-ground
      # tests self-skip per their own skipif, honestly.
      - name: test
        working-directory: a2a-compliance
        run: python3 -m pytest -q

  commit-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: commit discipline (new commits only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin ${{ github.base_ref }}
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }} -1"
          fi
          bad=0
          git log --no-merges --format='%s' $range | awk 'length($0)>72 {print "subject >72 chars: " $0; bad=1} END {exit bad}' || bad=1
          if git log --no-merges --format='%(trailers)' $range | grep -iE '^Co-Authored-By:.*(claude|codex|openai|anthropic|copilot|gemini)'; then
            echo "AI co-author trailer found — use the assisted line instead"; bad=1
          fi
          exit $bad
